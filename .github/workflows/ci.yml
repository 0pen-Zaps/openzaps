name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint · types · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:workflow
      - run: npm run build
      - run: npm run audit:production

  contracts:
    name: Contracts (build · unit · fuzz · invariant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: forge install foundry-rs/forge-std
      - run: forge fmt --check
      - run: forge build --sizes
      # Fixed-block fork suites depend on archive-capable Base/Robinhood RPCs and are exercised in
      # the live-chain release matrix. Public endpoints can return pruned-state errors or 429s on a
      # fresh runner, so the required PR gate stays hermetic.
      - run: forge test --no-match-path 'test/*.fork.t.sol'

  zappad-contracts:
    name: ZapPad contracts (format · build · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: forge fmt --root contracts/zappad --check
      - run: forge build --root contracts/zappad --sizes
      - run: npm run test:zappad:contracts

  zappad-robinhood-fork:
    name: ZapPad Robinhood archive fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - name: Explain unavailable fork gate
        if: env.ROBINHOOD_RPC_URL == '' && github.event_name == 'pull_request'
        run: |
          echo "::notice::ROBINHOOD_ARCHIVE_RPC_URL is not configured; the canonical ZapPad fork gate was not run for this pull request."
      - name: Require the canonical fork gate for release
        if: env.ROBINHOOD_RPC_URL == '' && github.event_name != 'pull_request'
        run: |
          echo "::error::ROBINHOOD_ARCHIVE_RPC_URL is required for main and manual ZapPad release validation."
          exit 1
      - uses: actions/setup-node@v4
        if: env.ROBINHOOD_RPC_URL != ''
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        if: env.ROBINHOOD_RPC_URL != ''
        run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        if: env.ROBINHOOD_RPC_URL != ''
        with:
          version: v1.5.1
      - name: Run canonical Robinhood fork gate
        if: env.ROBINHOOD_RPC_URL != ''
        run: npm run test:zappad:contracts:fork

  zappad-browser-fork:
    name: ZapPad browser lifecycle on Robinhood fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZAPPAD_E2E_ARCHIVE_RPC_URL: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - name: Explain unavailable browser fork gate
        if: env.ZAPPAD_E2E_ARCHIVE_RPC_URL == '' && github.event_name == 'pull_request'
        run: |
          echo "::notice::ROBINHOOD_ARCHIVE_RPC_URL is not configured; the deterministic ZapPad browser fork gate was not run for this pull request."
      - name: Require the browser fork gate for release
        if: env.ZAPPAD_E2E_ARCHIVE_RPC_URL == '' && github.event_name != 'pull_request'
        run: |
          echo "::error::ROBINHOOD_ARCHIVE_RPC_URL is required for main and manual ZapPad release validation."
          exit 1
      - uses: actions/setup-node@v4
        if: env.ZAPPAD_E2E_ARCHIVE_RPC_URL != ''
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        if: env.ZAPPAD_E2E_ARCHIVE_RPC_URL != ''
        with:
          version: v1.5.1
      - name: Install app and Chromium
        if: env.ZAPPAD_E2E_ARCHIVE_RPC_URL != ''
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run deterministic browser lifecycle
        if: env.ZAPPAD_E2E_ARCHIVE_RPC_URL != ''
        run: npm run test:zappad:e2e:fork

  zappad-slither:
    name: ZapPad Slither (fail high)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install slither-analyzer==0.11.5
      - run: slither . --filter-paths 'lib|test|script|node_modules' --exclude-low --exclude-informational --fail-high
        working-directory: contracts/zappad

  executor-and-agent-kit:
    name: Executor + Agent Kit (test · package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Executor + MCP tests
        run: node --test executor/*.test.mjs mcp/*.test.mjs packages/sdk/*.test.mjs packages/mcp/*.test.mjs
      - name: SDK import smoke
        run: node --input-type=module -e "const sdk = await import('./packages/sdk/index.js'); if (typeof sdk.buildOpenZapPolicy !== 'function') process.exit(1)"
      - name: MCP tool manifest smoke
        run: node packages/mcp/index.mjs tools | node -e "let body=''; process.stdin.on('data', c => body += c).on('end', () => { const tools = JSON.parse(body); if (!Array.isArray(tools) || tools.length < 5) process.exit(1) })"
      - name: Publish manifests
        run: |
          npm pack --dry-run ./packages/sdk
          npm pack --dry-run ./packages/mcp

  relay-database:
    name: Relay DB (PostgreSQL 16 replay · concurrency · privileges)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL 16 client and server binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: npm run test:relay-pg16

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans git history, so fetch all of it
      - name: Run gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
